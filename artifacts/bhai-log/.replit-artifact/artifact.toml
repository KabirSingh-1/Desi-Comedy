kind = "web"
previewPath = "/"
title = "BHAI LOG - Desi Comedy Live"
version = "1.0.0"
id = "artifacts/bhai-log"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23783

[services.development]
run = "pnpm --filter @workspace/bhai-log run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bhai-log", "run", "build" ]
publicDir = "artifacts/bhai-log/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23783"
BASE_PATH = "/"
